server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://backend:8000;
        # WebSocket upgrade (Browser Test stream) — without these three
        # lines the upgrade never reaches FastAPI and the browser reports
        # "The test stream connection failed." while plain REST works.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A test call can stream for minutes; do not cut it at 60s.
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri /index.html;
    }
}
