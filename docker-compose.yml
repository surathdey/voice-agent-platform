# Voice Agent Platform — full stack: PostgreSQL + FastAPI backend + React frontend.
#   cp .env.example .env   (fill in real provider keys later; not needed to test)
#   docker compose up --build
# Frontend: http://localhost:5173   API: http://localhost:8000/api/health
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vap-demo-password}
      POSTGRES_DB: ${POSTGRES_DB:-voice_platform}
    volumes:
      - vap_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vap} -d ${POSTGRES_DB:-voice_platform}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-vap}:${POSTGRES_PASSWORD:-vap-demo-password}@db:5432/${POSTGRES_DB:-voice_platform}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      TELEPHONY_MODE: ${TELEPHONY_MODE:-stub}
      VAPI_API_KEY: ${VAPI_API_KEY:-}
      VAPI_DEFAULT_MODEL: ${VAPI_DEFAULT_MODEL:-}
      VAPI_DEFAULT_VOICE: ${VAPI_DEFAULT_VOICE:-}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID:-}
      VAPI_SERVER_CREDENTIAL_ID: ${VAPI_SERVER_CREDENTIAL_ID:-}
      VAPI_EN_VOICE_PROVIDER: ${VAPI_EN_VOICE_PROVIDER:-}
      VAPI_EN_TTS_MODEL: ${VAPI_EN_TTS_MODEL:-}
      VAPI_EN_VOICE_ID_FEMALE: ${VAPI_EN_VOICE_ID_FEMALE:-}
      VAPI_EN_VOICE_ID_MALE: ${VAPI_EN_VOICE_ID_MALE:-}
      VAPI_HI_VOICE_PROVIDER: ${VAPI_HI_VOICE_PROVIDER:-}
      VAPI_HI_TTS_MODEL: ${VAPI_HI_TTS_MODEL:-}
      VAPI_HI_VOICE_ID_FEMALE: ${VAPI_HI_VOICE_ID_FEMALE:-}
      VAPI_HI_VOICE_ID_MALE: ${VAPI_HI_VOICE_ID_MALE:-}
      VAPI_BN_VOICE_PROVIDER: ${VAPI_BN_VOICE_PROVIDER:-}
      VAPI_BN_TTS_MODEL: ${VAPI_BN_TTS_MODEL:-}
      VAPI_BN_VOICE_ID_FEMALE: ${VAPI_BN_VOICE_ID_FEMALE:-}
      VAPI_BN_VOICE_ID_MALE: ${VAPI_BN_VOICE_ID_MALE:-}
      VAPI_EN_TRANSCRIBER_PROVIDER: ${VAPI_EN_TRANSCRIBER_PROVIDER:-}
      VAPI_EN_TRANSCRIBER_MODEL: ${VAPI_EN_TRANSCRIBER_MODEL:-}
      VAPI_HI_TRANSCRIBER_PROVIDER: ${VAPI_HI_TRANSCRIBER_PROVIDER:-}
      VAPI_HI_TRANSCRIBER_MODEL: ${VAPI_HI_TRANSCRIBER_MODEL:-}
      VAPI_BN_TRANSCRIBER_PROVIDER: ${VAPI_BN_TRANSCRIBER_PROVIDER:-}
      VAPI_BN_TRANSCRIBER_MODEL: ${VAPI_BN_TRANSCRIBER_MODEL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      PLIVO_AUTH_ID: ${PLIVO_AUTH_ID:-}
      PLIVO_AUTH_TOKEN: ${PLIVO_AUTH_TOKEN:-}
      EXOTEL_SID: ${EXOTEL_SID:-}
      EXOTEL_API_KEY: ${EXOTEL_API_KEY:-}
      EXOTEL_API_TOKEN: ${EXOTEL_API_TOKEN:-}
      EXOTEL_SUBDOMAIN: ${EXOTEL_SUBDOMAIN:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      VAPI_RATE_TELEPHONY_PER_MIN: ${VAPI_RATE_TELEPHONY_PER_MIN:-}
      PLIVO_RATE_TELEPHONY_PER_MIN: ${PLIVO_RATE_TELEPHONY_PER_MIN:-}
      SARVAM_RATE_STT_PER_MIN: ${SARVAM_RATE_STT_PER_MIN:-}
      SARVAM_RATE_LLM_PER_MIN: ${SARVAM_RATE_LLM_PER_MIN:-}
      SARVAM_RATE_TTS_PER_MIN: ${SARVAM_RATE_TTS_PER_MIN:-}
      VAPI_BASE_URL: ${VAPI_BASE_URL:-https://api.vapi.ai}
      PLIVO_BASE_URL: ${PLIVO_BASE_URL:-https://api.plivo.com}
      SARVAM_WS_URL: ${SARVAM_WS_URL:-wss://api.sarvam.ai}
      SARVAM_STT_MODEL: ${SARVAM_STT_MODEL:-saaras:v2.5}
      SARVAM_BASE_URL: ${SARVAM_BASE_URL:-https://api.sarvam.ai}
      SARVAM_TTS_MODEL: ${SARVAM_TTS_MODEL:-bulbul:v2}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      S3_RECORDINGS_BUCKET: ${S3_RECORDINGS_BUCKET:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      SEED_TENANT_NAME: ${SEED_TENANT_NAME:-QGBS}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-demo@qgbs.example}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-demo-password}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  vap_db:
